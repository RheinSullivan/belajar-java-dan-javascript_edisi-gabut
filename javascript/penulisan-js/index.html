<!DOCTYPE html> <!-- "DOCTYPE HTML" memberi tahu "Browser" kalau halaman ini memakai aturan HTML modern. -->
<html lang="en"> <!-- "html" adalah Tag utama halaman, semua bagian halaman ada di dalam Tag ini. -->
<head> <!-- "Head" adalah bagian informasi halaman, biasanya berisi "Meta", "Title", dan kadang "Script". -->
    <meta charset="UTF-8"> <!-- "UTF 8" membantu "Browser" membaca teks dan simbol dengan benar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- "Viewport" membantu halaman menyesuaikan ukuran layar perangkat. -->
    <title>Contoh Penulisan JawaSkrip Internal</title> <!-- "Title" adalah judul halaman yg tampil di Tab "Browser". -->

    <script> <!-- "Script" ini berisi JavaScript yg ditulis langsung di halaman, jadi ini disebut "Internal JavaScript". -->
        alert("Ini adalah contoh penulisan JawaSkrip internal :v"); // "alert" adalah "Function" bawaan JavaScript buat menampilkan pesan Pop Up, mirip pegawai toko yg langsung menyapa saat orang masuk.
    </script> <!-- Tag ini nutup bagian "Script", jadi perintah JavaScript di "Head" selesai di sini. -->
</head> <!-- Tag ini nutup bagian "Head". -->
<body> <!-- "Body" adalah bagian yg tampil di layar user. -->
   <h1>Belajar Bahasa Pemrograman JawaSkript Dasar</h1> <!-- "h1" adalah judul utama halaman, cocok buat tulisan paling besar di halaman. -->
   <p>Selamat belajar JawaSkript bareng Pria Solo :V</p> <!-- "p" adalah paragraf, cocok buat kalimat biasa di bawah judul. -->
</body> <!-- Tag ini nutup bagian "Body". -->
</html> <!-- Tag ini nutup seluruh halaman HTML. -->

<!--
Kesimpulan:
- "DOCTYPE HTML" memberi tahu "Browser" bahwa halaman ini menggunakan aturan HTML modern.
- "Internal JavaScript" berarti JavaScript ditulis langsung di dalam File HTML.
- "alert" dipakai buat menampilkan pesan Pop Up ke user.
- Kalau "Script" ditaruh di "Head", perintah bisa jalan sebelum isi "Body" selesai tampil.
- "h1" adalah judul utama halaman.
- "p" adalah paragraf biasa.
- Contoh awamnya adalah pintu toko otomatis.
- Saat orang masuk, bel atau suara sambutan langsung muncul.
- "alert" mirip sambutan itu karena muncul otomatis saat halaman dibuka.
- Untuk belajar awal, "alert" berguna karena hasil JavaScript langsung kelihatan.
- Untuk halaman serius, "alert" jangan terlalu sering dipakai karena bisa mengganggu orang yg membuka halaman.
-->
