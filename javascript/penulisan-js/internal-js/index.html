<!DOCTYPE html> <!-- "DOCTYPE HTML" memberi tahu "Browser" kalau File ini memakai aturan HTML modern. -->
<html lang="en"> <!-- "html" adalah Tag utama halaman, semua isi halaman berada di dalam Tag ini. -->
<head> <!-- "Head" adalah tempat info halaman, seperti judul Tab dan pengaturan tampilan awal. -->
    <meta charset="UTF-8"> <!-- "UTF 8" membantu teks terbaca benar, termasuk huruf, simbol, dan karakter khusus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- "Viewport" bikin halaman lebih aman saat dibuka di layar kecil atau besar. -->
    <title>Internal JawaSkrip</title> <!-- "Title" adalah judul halaman yg muncul di Tab "Browser". -->
</head> <!-- Tag ini nutup bagian "Head". -->
<body> <!-- "Body" adalah bagian utama halaman yg terlihat user. -->
    
    <script> <!-- "Script" ini adalah tempat menulis JavaScript langsung di dalam File HTML, cara ini disebut "Internal JavaScript". -->
        // Ini adalah contoh penulisan "JawaSkrip Internal", artinya Code JavaScript ditulis langsung di halaman HTML yg sama.
    </script> <!-- Tag ini nutup "Script Internal" pertama. -->

    <script type="text/javascript"> <!-- "Script" ini masih JavaScript juga, "type text/javascript" adalah penanda lama yg masih bisa dipakai. -->
        // Ini adalah contoh penulisan "JawaSkrip Internal" dengan "Type text JavaScript", jadi "Browser" diberi label bahwa isi Tag ini adalah JavaScript.
    </script> <!-- Tag ini nutup "Script Internal" kedua. -->

    <script src="script.js"> <!-- "src script.js" berarti JavaScript diambil dari File luar bernama "script.js", cara ini disebut "External JavaScript". -->
        // Ini adalah contoh "External JavaScript", artinya Code JavaScript ditaruh di File lain supaya HTML tidak terlalu penuh.
    </script> <!-- Tag ini nutup "Script External". -->

</body> <!-- Tag ini nutup bagian "Body". -->
</html> <!-- Tag ini nutup seluruh halaman HTML. -->

<!--
Kesimpulan:
- Ada beberapa cara menulis JavaScript di HTML.
- "Internal JavaScript" berarti Code JavaScript ditulis langsung di dalam File HTML.
- "External JavaScript" berarti Code JavaScript ditaruh di File lain lalu dipanggil dari HTML.
- "Script" tanpa "src" biasanya dipakai buat JavaScript yg ditulis langsung di halaman.
- "Script" dengan "src" dipakai buat mengambil JavaScript dari File luar.
- Contoh awamnya adalah catatan resep.
- "Internal JavaScript" seperti resep ditulis langsung di kertas yg sama dengan daftar belanja.
- "External JavaScript" seperti resep ditulis di buku lain, lalu kertas utama cuma menulis nama buku resepnya.
- Untuk belajar awal, "Internal JavaScript" boleh dipakai karena gampang dilihat.
- Untuk Project yg mulai besar, "External JavaScript" lebih rapi karena HTML dan JavaScript tidak numpuk di satu tempat.
-->
